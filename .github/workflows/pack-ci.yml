name: pack-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated providers to run against (e.g., claude-haiku,openai-mini)"
        required: false
        default: "mock"

permissions:
  contents: write    # required for release-on-main step
  checks: write      # required for JUnit test-reporter check run
  pull-requests: write

jobs:
  test:
    name: PromptArena (mock — hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run scenarios against mock provider
        uses: AltairaLabs/PromptKit/.github/actions/promptarena-action@actions/promptarena/v1
        with:
          config-file: config.arena.yaml
          providers: mock
          output-dir: out
          formats: json,junit,markdown

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: PromptArena scenarios (mock)
          path: out/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Append markdown report to job summary
        if: always() && hashFiles('out/results.md') != ''
        run: cat out/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arena report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arena-report
          path: out/

  test-real-providers:
    name: PromptArena (real providers — drift check)
    runs-on: ubuntu-latest
    # Runs on every PR and on manual dispatch. Requires repo secrets
    # ANTHROPIC_API_KEY and OPENAI_API_KEY — without them the job fails fast
    # with credential errors (intentional: the regression catch only works
    # against real models, not the hermetic mock fixtures).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Run scenarios against real providers
        uses: AltairaLabs/PromptKit/.github/actions/promptarena-action@actions/promptarena/v1
        with:
          config-file: config.arena.yaml
          providers: ${{ github.event.inputs.providers || 'claude-haiku,openai-mini' }}
          output-dir: out
          formats: json,junit,markdown
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: PromptArena scenarios (real providers)
          path: out/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Append markdown report to job summary
        if: always() && hashFiles('out/results.md') != ''
        run: cat out/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arena report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arena-report-real
          path: out/

  release:
    name: Compile and release pack artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p dist

      - name: Compile pack
        uses: AltairaLabs/PromptKit/.github/actions/packc-action@actions/packc/v1
        with:
          config-file: config.arena.yaml
          output: dist/release-notes.pack.json

      - name: Upload pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-pack
          path: dist/release-notes.pack.json
