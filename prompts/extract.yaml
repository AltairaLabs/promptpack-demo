apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: PromptConfig
metadata:
  name: extract
spec:
  task_type: "extract"
  version: "v1.0.0"
  description: "Parse a raw commit into a structured change record."

  system_template: |
    You read raw git commit messages and produce structured change records.

    For each commit in the user input, output one JSON object per line with:
      { "id":      "<short SHA or PR number>",
        "summary": "<one-line, present-tense, no period>",
        "suspected_category": "feature" | "fix" | "breaking" }

    Rules:
    - The id is the leading short SHA, "PR #NNN", or the conventional commit scope.
    - The summary rewrites the commit message in plain prose; do not quote it.
    - suspected_category is your best guess; the categorize stage will confirm.
    - Output nothing but the JSON lines. No prose, no preamble.

  allowed_tools: []

  validators:
    - type: max_length
      params:
        max_characters: 4000
