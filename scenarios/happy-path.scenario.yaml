apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: happy-path
spec:
  id: happy-path
  description: |
    Baseline scenario — same inputs as tone-check but lighter assertions, used
    as the canonical green run. If this one fails, something fundamental is
    broken (formatting, coverage, structure).
  task_type: "compose"

  turns:
    - role: user
      content: |
        [
          { "id": "abc1234", "category": "feature",   "summary": "Adds retry budget for outbound webhooks." },
          { "id": "def5678", "category": "fix",       "summary": "Restores pagination cursor on the audit log endpoint." },
          { "id": "ghi9012", "category": "breaking",  "summary": "Renames api.foo() to api.foo_v2(); old name removed." },
          { "id": "jkl3456", "category": "fix",       "summary": "Stops leaking trace ids into customer-facing error messages." },
          { "id": "mno7890", "category": "feature",   "summary": "Adds --dry-run flag to the migrate command." }
        ]
      assertions:
        # All three sections present in order.
        - type: content_matches
          params:
            pattern: "## Breaking Changes[\\s\\S]+## Features[\\s\\S]+## Bug Fixes"
            message: "Output must include Breaking Changes, Features, and Bug Fixes sections in that order."

        # Coverage — every input id referenced.
        - type: contains_all
          params:
            patterns: ["`abc1234`", "`def5678`", "`ghi9012`", "`jkl3456`", "`mno7890`"]
            message: "All five change ids must appear in the output."

        # Each entry uses the bullet + backticked id + em-dash format.
        - type: content_matches
          params:
            pattern: "- `[a-zA-Z0-9]+` — "
            message: "Each entry must use '- `<id>` — ' bullet format."
